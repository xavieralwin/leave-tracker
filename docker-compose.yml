services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - PORT=5000
    expose:
      - "5000"
    volumes:
      - leave_tracker_data:/app/server/data

volumes:
  leave_tracker_data: